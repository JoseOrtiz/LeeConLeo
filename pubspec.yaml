name: lee_con_leo
description: "Learn to read by playing with Leo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  path: ^1.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/prompts/
    - assets/audio/sounds/
    - assets/content/bundle.json
    - assets/images/leo/
    - assets/images/scenes/
    - assets/images/steps/
    - assets/images/words/
  fonts:
    - family: PlaywriteCL
      fonts:
        - asset: assets/fonts/PlaywriteCL.ttf
