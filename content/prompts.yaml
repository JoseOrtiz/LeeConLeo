feedback.correct:
  - ¡Muy bien!
  - ¡Excelente!
  - ¡Lo lograste!
  - ¡Súper!

feedback.retry:
  - ¡Casi! Inténtalo otra vez.
  - Escucha otra vez.

feedback.hint:
  - Mira, te ayudo.

reward:
  - ¡Terminaste! Ganaste una estrella.

home.intro:
  - ¡Hola! Soy Leo. Toca donde estoy yo para jugar.

home.locked:
  - Todavía no. Primero juega donde estoy yo.

spatial.up_down.intro:
  - ¡Hola! Soy Leo. Ayúdame a encontrar arriba y abajo.

spatial.up_down.up:
  - Toca la flecha de arriba.

spatial.up_down.down:
  - Toca la flecha de abajo.

spatial.left_right.intro:
  - ¡Ahora vamos a mirar a los lados! Ayúdame a encontrar izquierda y derecha.

spatial.left_right.left:
  - Toca la flecha de la izquierda.

spatial.left_right.right:
  - Toca la flecha de la derecha.

spatial.positions.intro:
  - ¡Juguemos con la pelota! Escucha dónde va y arrástrala con tu dedo.

spatial.positions.over:
  - Pon la pelota arriba de la mesa.

spatial.positions.under:
  - Pon la pelota abajo de la mesa.

spatial.positions.between:
  - Pon la pelota entre las mesas.

letter.meet.intro:
  - ¡Te voy a presentar una letra! Escucha y tócala.

letter.trace.intro:
  - ¡Ahora dibujemos la letra! Pon tu dedo en el punto que brilla y sigue el camino.

letter.find.intro:
  - ¡Mira cuántas burbujas! Revienta las que tienen la letra que te digo.

letter.meet.a:
  - Esta es la... a. ¡La... a de abeja! ¡Tócala!

letter.meet.a.upper:
  - Toca la... a mayúscula.

letter.meet.a.lower:
  - Toca la... a minúscula.

letter.trace.a.lower:
  - Repasa la... a minúscula con tu dedo.

letter.trace.a.upper:
  - Repasa la... a mayúscula con tu dedo.

letter.find.a:
  - Revienta las burbujas que tienen la... a.

